{% load static humanize %}<article class="product-card"><a class="product-image" href="{% url 'product_detail' product.slug %}">{% if product.featured %}<span class="badge">Editor's pick</span>{% endif %}<img src="{% static product.image %}" alt="{{ product.name }}" loading="lazy"></a><div class="product-body"><span class="eyebrow">{{ product.brand }} / {{ product.category.name }}</span><a class="product-name" href="{% url 'product_detail' product.slug %}">{{ product.name }}</a><div class="product-bottom"><strong>₹{{ product.price|floatformat:0|intcomma }}</strong><form method="post" action="{% url 'cart_change' product.pk %}">{% csrf_token %}<button class="add-button" aria-label="Add {{ product.name }} to bag" {% if not product.stock %}disabled{% endif %}>{% if product.stock %}+{% else %}—{% endif %}</button></form></div><span class="stock">{% if product.stock %}Available now{% else %}Out of stock{% endif %}</span></div></article>
